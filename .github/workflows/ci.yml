name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Service tests run against real Postgres (PGlite, in-process) — no DB service needed.
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: postgres://build:build@localhost:5432/build
